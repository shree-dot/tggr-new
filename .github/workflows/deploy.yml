name: Deploy to NAS

# Runs on every push to master, and can be triggered manually from the
# Actions tab (Run workflow).
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into the NAS and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          port: ${{ secrets.NAS_PORT }}
          # Use ONE of the two below. Key is recommended; comment it out and
          # uncomment `password` if you'd rather use a password.
          key: ${{ secrets.NAS_SSH_KEY }}
          # password: ${{ secrets.NAS_PASSWORD }}
          # Give docker builds room; large images can take a while.
          command_timeout: 30m
          script: |
            set -e

            # --- edit these two if your paths differ ---
            REPO_DIR="$HOME/tggr-new"
            export DOCKER_CONFIG=/DATA/.docker   # ZimaOS: /root is read-only
            # --------------------------------------------

            echo "==> Entering $REPO_DIR"
            cd "$REPO_DIR"

            # Pick whichever compose command exists on this box.
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "ERROR: neither 'docker compose' nor 'docker-compose' is installed"
              exit 1
            fi
            echo "==> Using: $DC"

            echo "==> Pulling latest code"
            git fetch origin
            git reset --hard origin/master   # keep server tree exactly matching git
            # Note: data/ is gitignored, so your database and files are untouched.

            echo "==> Stopping current container"
            $DC down || true

            echo "==> Building image"
            $DC build

            echo "==> Starting container"
            $DC up -d

            echo "==> Pruning old dangling images"
            docker image prune -f || true

            echo "==> Done. Current status:"
            $DC ps
